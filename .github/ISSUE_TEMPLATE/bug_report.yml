name: "🐛 Bug Report (English)"
description: Report a bug or unexpected behavior in Aerovoice.
title: "[BUG]: <Short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context and detail as possible to help reproduce the problem.

  - type: input
    id: go-version
    attributes:
      label: 🔧 Go Version
      description: "Output of `go version`."
      placeholder: "go1.26.0 darwin/arm64"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 💻 Operating System & Environment
      description: "OS name and version."
      placeholder: "macOS 15.5 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 📦 Affected Component
      description: Select the primary subsystem experiencing the issue.
      options:
        - "VCS Console (cmd/vcs, internal/vcs)"
        - "GRS Radio Emulator (cmd/grs, internal/grs)"
        - "ED-137 Radio Header & Protocol (internal/ed137)"
        - "SIP & SDP Signaling (internal/sip)"
        - "Audio Codec & Jitter Buffer (internal/media)"
        - "HTMX Web UI & Static Assets (internal/vcs, internal/grs)"
        - "PCAP Capture & Analyzer (internal/pcap)"
        - "Channel & Node Supervision (internal/channel)"
        - "Configuration & Logging (internal/config)"
        - "CI, E2E & GitHub Pages (.github, test, scripts)"
        - "Documentation (docs, README)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Bug Description
      description: A clear and concise description of what happened.
      placeholder: |
        When connecting to the GRS emulator and pressing PTT, audio playback is truncated or does not start.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start GRS with `make grs-run`
        2. Start VCS with `make vcs-run`
        3. Navigate to http://127.0.0.1:8082
        4. Click Connect on Channel 1
        5. Press and hold PTT
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      description: What you expected to happen.
      placeholder: |
        Audio should stream continuously while PTT is held down and SQU indicator should illuminate on GRS.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 Logs & Terminal Output
      description: Relevant logs or error messages from VCS / GRS console or `make test`.
      render: shell
      placeholder: |
        2026/09/26 19:48:51 ERROR [ED-137] Failed to establish RTP session: ...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📌 Additional Context
      description: Any other context, network configurations, or PCAP traces.
    validations:
      required: false
