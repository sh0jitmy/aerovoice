name: "✨ 機能要望 (Feature Request - 日本語)"
description: Aerovoice への新機能や改善の提案を日本語で行います。
title: "[FEATURE]: 短い要約"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能や改善のアイデアをお寄せいただきありがとうございます。

  - type: textarea
    id: summary
    attributes:
      label: 📝 提案の概要
      description: 追加したい機能や改善内容を簡潔に説明してください。
      placeholder: |
        SDP offer/answer に基づく G.711 μ-law および A-law コーデックの動的切替をサポートしたい。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 💡 動機・背景
      description: なぜこの機能が必要ですか？ どのような課題を解決しますか？
      placeholder: |
        一部の欧州 ATM 地上局では ED-137B Part 1 に準拠して G.711 A-law (PCMA) が要求されるため。
    validations:
      required: true

  - type: checkboxes
    id: category
    attributes:
      label: 📦 影響範囲
      description: この提案が影響するサブシステムを選択してください。
      options:
        - label: "VCS コンソール (cmd/vcs, internal/vcs)"
        - label: "GRS 無線エミュレータ (cmd/grs, internal/grs)"
        - label: "ED-137 無線ヘッダー & プロトコル (internal/ed137)"
        - label: "SIP / SDP シグナリング (internal/sip)"
        - label: "音声コーデック & ジッターバッファ (internal/media)"
        - label: "HTMX Web UI & 静的アセット (internal/vcs, internal/grs)"
        - label: "PCAP パケットキャプチャ & アナライザ (internal/pcap)"
        - label: "チャネル & ノード死活監視 (internal/channel)"
        - label: "設定 & ログ (internal/config)"
        - label: "CI / CD / E2E テスト (.github, test, scripts)"
        - label: "ドキュメント (docs, README)"

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 代替案の検討
      description: 他に検討した方法があれば記載してください。
      placeholder: |
        GRS エミュレータへ送信する前に外部で音声変換を行うなど。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📌 追加情報
      description: 関連する ICAO / EUROCAE 規格や参考情報があれば記載してください。
    validations:
      required: false
