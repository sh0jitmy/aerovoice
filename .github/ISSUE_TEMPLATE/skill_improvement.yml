name: "💡 AI Skill Improvement (English)"
description: Suggest improvements or report anomalies for AI Agent custom skills (.agents/skills, .claude/skills).
title: "[SKILL]: <Skill Name> - <Short summary>"
labels: ["skill-improvement"]
body:
  - type: markdown
    attributes:
      value: |
        Please let us know about any malfunctions, missing rules, or improvements for custom AI Agent skills.

  - type: dropdown
    id: skill-name
    attributes:
      label: 🎯 Target Skill Name
      description: Select the custom skill that requires tuning.
      options:
        - agent-skill-evaluator
        - ai-skill-engineering
        - database-design
        - documentation-governance
        - evidence-governance
        - git-strategy
        - github-copilot-review
        - github-pr-creator
        - golang-design
        - golang-e2e-testing
        - golang-htmx-frontend
        - golang-implementation
        - golang-lint-governance
        - golang-observability
        - golang-sqlite-governance
        - marketing-strategy
        - multi-tier-e2e-testing
        - network-design
        - observability-stack
        - openapi-design
        - openapi-design-review
        - product-management
        - quality-inspector
        - sakuracloud-solution-architect
        - software-architecture
        - sre-deployment
        - transaction-profiling-analyzer
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: 🚨 Issue Category
      description: What type of discrepancy or issue occurred?
      options:
        - "Under-triggering (Skill was not loaded when it should have been)"
        - "Over-triggering (Skill loaded unexpectedly in unrelated tasks)"
        - "Incorrect/Bad Advice (Skill proposed outdated or suboptimal design/code)"
        - "Missing Rule (Important practice or constraint is missing)"
        - "Outdated (Skill references obsolete files or conventions)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Details of the Issue
      description: Describe what instructions/prompt caused the issue and the observed behavior.
      placeholder: |
        When modifying VCS HTMX handlers, the agent did not activate documentation-governance to update docs/manual.md.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Agent Behavior
      description: How should the AI agent behave in this situation?
      placeholder: |
        The agent should check documentation-governance and proactively update both README and manual.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 🛠️ Proposed Solution / Rule Addition
      description: Specific suggestions for modifying SKILL.md.
    validations:
      required: false
