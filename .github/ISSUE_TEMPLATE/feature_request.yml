name: "✨ Feature Request (English)"
description: Suggest an idea or enhancement for Aerovoice.
title: "[FEATURE]: <Short summary>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a feature proposal! Please share your ideas on how to improve Aerovoice.

  - type: textarea
    id: summary
    attributes:
      label: 📝 Proposal Summary
      description: A clear and concise description of the proposed feature or improvement.
      placeholder: |
        Support dynamic switching of G.711 μ-law and A-law codecs based on SDP offer/answer.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 💡 Motivation & Background
      description: Why is this feature needed? What problem does it solve?
      placeholder: |
        Some international European ATM ground stations require G.711 A-law (PCMA) in compliance with ED-137B Part 1.
    validations:
      required: true

  - type: checkboxes
    id: category
    attributes:
      label: 📦 Impacted Subsystems
      description: Select the subsystems that would be affected by this proposal.
      options:
        - label: "VCS Console (cmd/vcs, internal/vcs)"
        - label: "GRS Radio Emulator (cmd/grs, internal/grs)"
        - label: "ED-137 Radio Header & Protocol (internal/ed137)"
        - label: "SIP & SDP Signaling (internal/sip)"
        - label: "Audio Codec & Jitter Buffer (internal/media)"
        - label: "HTMX Web UI & Static Assets (internal/vcs, internal/grs)"
        - label: "PCAP Capture & Analyzer (internal/pcap)"
        - label: "Channel & Node Supervision (internal/channel)"
        - label: "Configuration & Logging (internal/config)"
        - label: "CI, E2E & GitHub Pages (.github, test, scripts)"
        - label: "Documentation (docs, README)"

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives Considered
      description: Any alternative solutions or workarounds you considered.
      placeholder: |
        Converting audio externally before sending to the GRS emulator.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📌 Additional Context
      description: Additional context, relevant ICAO / EUROCAE standards, or references.
    validations:
      required: false
